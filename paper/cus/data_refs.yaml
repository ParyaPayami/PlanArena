# Datasets cited in the Computational Urban Science version (APA 7 "Data set" entries, formatted by planarena/apa.py).
# Titles are the publishers' dataset names (NYC Open Data titles read from its catalogue API) or, for multi-source city
# twins, the source description recorded in each twin's twin_meta.json; URLs are those the pipeline downloads from
# (planarena/tools/fetch_open_data.py, planarena/cities/adapters/*, twin_meta.json source_url).
